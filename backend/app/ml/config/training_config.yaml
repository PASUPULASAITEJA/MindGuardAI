# MindGuardAI Machine Learning Pipeline Configuration

experiment:
  name: "mindguard_multimodal_clinical_triage"
  random_seed: 42
  version: "2.1.0"
  output_dir: "backend/app/ml/models"
  reports_dir: "reports"

data:
  dataset_dir: "Dataset/phq_gad"
  train_split: 0.80
  test_split: 0.20
  stratify: true
  id_column: "export_id"
  target_column: "risk_level"
  classes:
    - "GREEN"
    - "YELLOW"
    - "RED"

features:
  phq_items: ["phq_q1", "phq_q2", "phq_q3", "phq_q4", "phq_q5", "phq_q6", "phq_q7", "phq_q8", "phq_q9"]
  gad_items: ["gad_q1", "gad_q2", "gad_q3", "gad_q4", "gad_q5", "gad_q6", "gad_q7"]
  scales: ["isi_total", "pss_total"]
  cognitive_latency: ["phq_mean_time", "gad_mean_time", "q9_hesitation_ratio"]
  demographics: ["age", "is_female"]

random_forest:
  n_estimators: 150
  max_depth: 12
  min_samples_split: 5
  min_samples_leaf: 2
  class_weight: "balanced"
  criterion: "gini"
  n_jobs: 1

distilbert:
  model_name: "distilbert-base-uncased"
  num_labels: 6
  labels: ["joy", "sadness", "anxiety", "anger", "fear", "surprise"]
  max_length: 128
  batch_size: 16
  learning_rate: 2.0e-5
  num_epochs: 3
  weight_decay: 0.01
  warmup_steps: 100
