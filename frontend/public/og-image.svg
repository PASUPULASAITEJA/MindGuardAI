<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#10172A" />
      <stop offset="100%" stop-color="#151E34" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7657E8" />
      <stop offset="50%" stop-color="#9A82C9" />
      <stop offset="100%" stop-color="#19B99A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glowViolet" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7657E8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7657E8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowTeal" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#19B99A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#19B99A" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />
  <circle cx="350" cy="200" r="400" fill="url(#glowViolet)" />
  <circle cx="950" cy="450" r="350" fill="url(#glowTeal)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Brand Badge Top Left -->
  <g transform="translate(80, 80)">
    <rect width="200" height="40" rx="20" fill="#1E293B" stroke="#7657E8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="24" cy="20" r="6" fill="#19B99A" />
    <text x="40" y="25" fill="#E2E8F0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CALM INTELLIGENCE</text>
  </g>

  <!-- Center Content Area -->
  <g transform="translate(80, 160)">
    <!-- Shield Logo Icon -->
    <g transform="translate(0, 5)">
      <rect width="84" height="84" rx="22" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="2.5" />
      <path d="M42 18 L64 26 V44 C64 56 53 66 42 70 C31 66 20 56 20 44 V26 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="42" cy="38" r="6" fill="#7657E8" />
      <path d="M36 50 C36 46 48 46 48 50" stroke="#19B99A" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text x="110" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">MindGuard<tspan fill="#7657E8">AI</tspan></text>
    <text x="110" y="85" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500">Student Mental Wellness &amp; Digital Phenotyping Platform</text>
  </g>

  <!-- Subheading / Tagline -->
  <g transform="translate(80, 310)">
    <text fill="#E2E8F0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
      Proactive clinical triage, privacy-first screen-time analysis,
    </text>
    <text y="42" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400">
      and confidential AI wellness companion for university communities.
    </text>
  </g>

  <!-- 3 Feature Cards along bottom -->
  <g transform="translate(80, 430)">
    <!-- Card 1 -->
    <g>
      <rect width="320" height="110" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="36" r="14" fill="#7657E8" fill-opacity="0.2" />
      <text x="36" y="41" fill="#7657E8" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="bold">🛡</text>
      <text x="64" y="40" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Non-Diagnostic Safety</text>
      <text x="24" y="72" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400">FERPA &amp; HIPAA-aligned early intervention,</text>
      <text x="24" y="90" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400">never autonomous clinical diagnosis.</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(345, 0)">
      <rect width="320" height="110" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="36" r="14" fill="#19B99A" fill-opacity="0.2" />
      <text x="36" y="41" fill="#19B99A" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="bold">⏱</text>
      <text x="64" y="40" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Idle-Filtered Telemetry</text>
      <text x="24" y="72" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400">Authentic OS-level active computer tracking</text>
      <text x="24" y="90" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400">with zero synthetic placeholders.</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(690, 0)">
      <rect width="320" height="110" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="36" r="14" fill="#9A82C9" fill-opacity="0.2" />
      <text x="36" y="41" fill="#9A82C9" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="bold">🔒</text>
      <text x="64" y="40" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">k-Anonymity Analytics</text>
      <text x="24" y="72" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400">Institutional trends suppressed for cohorts &lt; 10</text>
      <text x="24" y="90" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400">to guarantee student privacy.</text>
    </g>
  </g>
</svg>
