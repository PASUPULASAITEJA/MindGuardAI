version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 2>/dev/null || nvm use 18 2>/dev/null || true
        - cd frontend && npm ci
    build:
      commands:
        - cd frontend && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
