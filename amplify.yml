version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 2>/dev/null || nvm use 18 2>/dev/null || true
        - if [ -d "frontend" ]; then cd frontend; fi
        - npm ci
    build:
      commands:
        - if [ -d "frontend" ]; then cd frontend; fi
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
