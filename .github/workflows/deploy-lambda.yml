name: Deploy Backend to AWS Lambda

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mindguard-backend
  LAMBDA_FUNCTION_NAME: mindguard-api
  LAMBDA_ROLE_ARN: arn:aws:iam::008402584969:role/mindguard-lambda-role

jobs:
  build-and-deploy:
    name: Build & Deploy Container to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: 5. Create or Update AWS Lambda Function Automatically
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          
          # Check if the Lambda function already exists
          if aws lambda get-function --function-name ${{ env.LAMBDA_FUNCTION_NAME }} --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "Updating existing Lambda function..."
            aws lambda update-function-code \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --image-uri $IMAGE_URI \
              --region ${{ env.AWS_REGION }}
            
            echo "Waiting for Lambda function update to complete..."
            aws lambda wait function-updated \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating new Lambda function from container image..."
            aws lambda create-function \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role ${{ env.LAMBDA_ROLE_ARN }} \
              --timeout 30 \
              --memory-size 1024 \
              --environment "Variables={ENVIRONMENT=production,CORS_ORIGINS=[\"https://main.d1s655v046pfka.amplifyapp.com\"]}" \
              --region ${{ env.AWS_REGION }}

            echo "Enabling public Function URL with CORS..."
            aws lambda create-function-url-config \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --auth-type NONE \
              --cors "AllowOrigins=[\"https://main.d1s655v046pfka.amplifyapp.com\"],AllowMethods=[\"*\"],AllowHeaders=[\"*\"]" \
              --region ${{ env.AWS_REGION }}

            aws lambda add-permission \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --action lambda:InvokeFunctionUrl \
              --statement-id FunctionURLAllowPublicAccess \
              --principal "*" \
              --function-url-auth-type NONE \
              --region ${{ env.AWS_REGION }}
          fi

      - name: 6. Output Live Function URL
        run: |
          URL=$(aws lambda get-function-url-config --function-name ${{ env.LAMBDA_FUNCTION_NAME }} --region ${{ env.AWS_REGION }} --query "FunctionUrl" --output text)
          echo "===================================================="
          echo "Your Live AWS Lambda Backend URL is: $URL"
          echo "===================================================="
