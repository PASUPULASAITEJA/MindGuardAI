name: MindGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, anoushka-dev ]
  pull_request:
    branches: [ main, anoushka-dev ]

jobs:
  frontend-quality:
    name: Frontend Lint & TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Strict Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

  backend-quality:
    name: Backend Syntax, Security & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8 bandit

      - name: Python Code Syntax & Lint Check
        working-directory: ./backend
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Static Security Scan (Bandit)
        working-directory: ./backend
        run: |
          bandit -r app -ll -ii

  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: docker compose config
